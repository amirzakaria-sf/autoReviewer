[project]
name = "whipguard-backend"
version = "0.1.0"
description = "WhipGuard backend: FastAPI + LangGraph bug/fix councils"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2.45",
  "langgraph-checkpoint-postgres>=2.0.1",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "playwright>=1.48",
  "python-dotenv>=1.0",
  "pydantic-settings>=2.5",
  "pydantic>=2.9",
  "openai>=1.50",
  "psycopg[binary,pool]>=3.2",
  "itsdangerous>=2.2",
  "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
