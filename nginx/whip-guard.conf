# WhipGuard -- https://whip-guard.zakarias.in
# Installed as /etc/nginx/conf.d/whip-guard.zakarias.in.conf on the AWS host
# (13.60.61.135). Frontend 127.0.0.1:3300, backend 127.0.0.1:8300, both bound
# to loopback by docker-compose.yml.
#
# This host is shared with a dozen sibling sites. Three things follow:
#   - `map $http_upgrade $connection_upgrade` is declared once, in
#     conf.d/zakarias.in.conf. Redeclaring it here fails the whole config.
#   - TLS settings come from the shared snippet, like every other vhost.
#   - The `showcase` deployment (~/demoStuff/demoApps) used to generate a
#     vhost for this same hostname. It is disabled in /etc/nginx/disabled/ and
#     commented out of deploy/vhosts.tsv; two server blocks with one
#     server_name means nginx silently serves whichever loaded first.
#
# Certificate: `certbot certonly --webroot -w /var/www/certbot -d
# whip-guard.zakarias.in`, renewed by the host's certbot-renew.timer.
#
# Login is app-level (a session cookie and a real login page), never nginx
# Basic Auth: stacking both put the browser's credential popup in front of
# the app's own login.

upstream whipguard_backend {
    server 127.0.0.1:8300;
}

upstream whipguard_frontend {
    server 127.0.0.1:3300;
}

server {
    listen 80;
    listen [::]:80;
    server_name whip-guard.zakarias.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whip-guard.zakarias.in;
    ssl_certificate     /etc/letsencrypt/live/whip-guard.zakarias.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whip-guard.zakarias.in/privkey.pem;
    include /etc/nginx/showcase/snippets/ssl.conf;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://whipguard_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A council call can run a Playwright check against a live preview
        # before it responds; the 60s default is too tight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live activity feed. ws.py authenticates its own handshake: the HTTP
    # middleware does not run for websocket scopes.
    location /ws/ {
        proxy_pass http://whipguard_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://whipguard_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
