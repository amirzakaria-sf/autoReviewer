# WhipGuard — https://whip-guard.zakarias.in
#
# Port map on this host (see /etc/nginx/sites-available/lumen.conf for the master list):
#   opencode (Whip)   frontend 3000, backend 8000
#   classroom (EduX)  frontend 3100, backend 8100
#   lumen             web      3200, inngest 8388 (not proxied; localhost only)
#   whip-guard frontend 3300, backend 8300
#
# `map $http_upgrade $connection_upgrade` is already declared globally by
# opencode.conf. Do NOT redeclare it here — nginx refuses duplicate maps and the
# whole config fails to load.
#
# SSL is intentionally absent: `certbot --nginx -d whip-guard.zakarias.in` injects
# the 443 server block, the certificate paths, and the http->https redirect. This
# file is the pre-TLS shape.

server {
    server_name whip-guard.zakarias.in;

    client_max_body_size 25m;

    # GitHub/Slack webhook deliveries land under here too (POST /api/webhooks/github,
    # /api/webhooks/slack) — plain POSTs, no separate location block needed.
    location /api/ {
        proxy_pass http://whipguard_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A council/fix-council API call can legitimately run a Playwright check
        # against a live preview before responding; 60s default is too tight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live council/fix activity feed (§7.4 of plan.md).
    location /ws/ {
        proxy_pass http://whipguard_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://whipguard_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen 80;
}
