# Hand-written for the WhipGuard hackathon build — no deploy.sh yet.
# Sibling projects' deploy.sh scripts regenerate their own upstream-*.conf on every
# deploy (blue/green colour swap). This one stays a plain single-target upstream —
# no blue/green — until/unless a real deploy script is written for this project.
upstream whipguard_backend {
    server 127.0.0.1:8300;
}

upstream whipguard_frontend {
    server 127.0.0.1:3300;
}
