display_information:
  name: WhipGuard
  description: Raises and fixes UI bugs, posts approve/reject gates for review.
  background_color: "#4A154B"
features:
  bot_user:
    display_name: writ
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
    request_url: https://whip-guard.zakarias.in/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
