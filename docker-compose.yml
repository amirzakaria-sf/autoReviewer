services:
  postgres:
    # pgvector, not plain postgres:16 -- same Postgres 16, the pgvector
    # extension pre-built in. Compatible with the existing data volume (it's
    # the same base image plus one extension), no migration needed to switch.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: whipguard
      POSTGRES_USER: whipguard
      POSTGRES_PASSWORD: whipguard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - whipguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whipguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://whipguard:whipguard@postgres:5432/whipguard
      WORKSPACE_HOST_PATH: ${PWD}/workspace
      SANDBOX_UID: "${UID:-1000}"
      SANDBOX_GID: "${GID:-1000}"
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/srv/workspace

  frontend:
    build: ./frontend
    # No NEXT_PUBLIC_API_BASE_URL here on purpose: unset means the dashboard
    # calls same-origin relative paths (/api/..., /ws/...), which is what
    # actually works once nginx is proxying both frontend and backend under
    # one public hostname. A baked-in http://localhost:8300 would resolve to
    # the VIEWER's own machine, not this server, for anyone but the developer
    # running docker-compose locally.
    ports:
      - "127.0.0.1:3300:3300"
    depends_on:
      - backend

volumes:
  whipguard_pg_data:
