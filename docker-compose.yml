services:
  postgres:
    # pgvector, not plain postgres:16 -- same Postgres 16, the pgvector
    # extension pre-built in. Compatible with the existing data volume (it's
    # the same base image plus one extension), no migration needed to switch.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: whipguard
      POSTGRES_USER: whipguard
      POSTGRES_PASSWORD: whipguard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - whipguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whipguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Named explicitly so the worker below can reference this exact image
    # instead of building its own copy -- see the worker service for why.
    image: whipguard-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://whipguard:whipguard@postgres:5432/whipguard
      # .env's own WORKSPACE_ROOT is a LOCAL-VENV-ONLY override (this
      # container's filesystem layout differs from a bare venv's), but
      # env_file: .env below loads it indiscriminately regardless -- same
      # class of leak as DATABASE_URL above, fixed the same way: an explicit
      # environment: entry here wins over env_file per Compose's documented
      # precedence. Left unfixed, this silently pointed every worktree
      # operation at the read-only repo-root mount below instead of the
      # writable one (found by actually running the eval harness once and
      # reading "Read-only file system" out of a git fetch, not by assuming
      # the workspace path was right).
      WORKSPACE_ROOT: /srv/workspace
      WORKSPACE_HOST_PATH: ${PWD}/workspace
      SANDBOX_UID: "${UID:-1000}"
      SANDBOX_GID: "${GID:-1000}"
      REPO_ROOT: ${PWD}
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # NO docker.sock here, deliberately (plan.md §15). This process renders
      # model output and untrusted repository text, so it must not hold a
      # handle to the host daemon -- an RCE here would otherwise reach the
      # host directly. Everything privileged is queued for the `worker`
      # service below, which does have the socket and no inbound port.
      #
      # The workspace stays mounted READ-ONLY: retrieval and the dashboard
      # read worktrees, but nothing on this side writes to them.
      - ./workspace:/srv/workspace:ro

  # The privileged half (plan.md §15). Same image, different entrypoint: it
  # polls work_items and executes what it finds. No `ports:` on purpose --
  # nothing can reach it, and the arrow between the two halves points one
  # way, through the database.
  worker:
    # Deliberately NO `build:` -- it reuses the backend's image by tag.
    #
    # With its own `build: ./backend`, Compose gave this service a SEPARATE
    # image (repofixer-worker), so `docker compose build backend` rebuilt the
    # web process and left the worker on whatever it was first built with.
    # The worker is the half that actually executes everything, so three
    # deploys ran against stale code without a single visible error -- the
    # containers were healthy, the queue drained, and the new code simply
    # was not there. Sharing one tag makes that drift impossible rather than
    # something a deploy script has to remember.
    image: whipguard-backend:latest
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://whipguard:whipguard@postgres:5432/whipguard
      WORKSPACE_ROOT: /srv/workspace
      WORKSPACE_HOST_PATH: ${PWD}/workspace
      SANDBOX_UID: "${UID:-1000}"
      SANDBOX_GID: "${GID:-1000}"
      REPO_ROOT: ${PWD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/srv/workspace
      # Mounted at its OWN real host path (not translated) on purpose: the
      # redeploy runs `docker compose build/up` from INSIDE this container
      # against the host's dockerd. docker compose hands the daemon each
      # service's resolved volume path as-is -- if that string were this
      # container's own view of the path, the host daemon (which has no such
      # directory) would fail to bind-mount. source==target makes the same
      # string valid on both sides, the Docker-outside-of-Docker idiom
      # docker.sock itself already relies on.
      - ${PWD}:${PWD}:ro

  frontend:
    build: ./frontend
    # No NEXT_PUBLIC_API_BASE_URL here on purpose: unset means the dashboard
    # calls same-origin relative paths (/api/..., /ws/...), which is what
    # actually works once nginx is proxying both frontend and backend under
    # one public hostname. A baked-in http://localhost:8300 would resolve to
    # the VIEWER's own machine, not this server, for anyone but the developer
    # running docker-compose locally.
    ports:
      - "127.0.0.1:3300:3300"
    depends_on:
      - backend

volumes:
  whipguard_pg_data:
